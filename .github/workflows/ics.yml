name: Build the calendar feed

# calendar.ics is the troop's schedule in the format calendar apps read. It is
# generated from data/, never edited by hand, and committed so GitHub Pages can
# serve it as a plain static file at /calendar.ics.
#
# One direction only. This repository is the schedule and subscribers read it.
# Nothing here holds a credential or writes to anybody else's calendar.

on:
  push:
    branches: [main]
    paths:
      - 'data/meetings.json'
      - 'data/events.json'
      - 'data/site.json'
      - 'scripts/build_ics.py'
      - '.github/workflows/ics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ics
  cancel-in-progress: false

jobs:
  build:
    # Do not react to the commit this job makes itself.
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the build rules
        working-directory: scripts
        run: |
          pip install --quiet pytest
          python -m pytest -q

      # stamp.yml fires on the same push as this job whenever a commit touches
      # both a page and the schedule, and it commits too. Whichever job pushes
      # second used to lose outright. So rather than building once and hoping
      # main held still, each attempt starts from whatever is on main right
      # now and regenerates the feed against it. There is no rebase and so no
      # conflict to resolve: calendar.ics is a pure function of data/, and
      # rebuilding against the newer tree is not a workaround for the race but
      # the correct answer to it.
      - name: Build the feed and commit it if it moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            python3 scripts/build_ics.py

            # --porcelain rather than `git diff`, so a calendar.ics that is not
            # yet tracked still counts as a change on the very first run.
            if [ -z "$(git status --porcelain -- calendar.ics)" ]; then
              echo "The feed already matched the schedule."
              exit 0
            fi

            git add calendar.ics
            git commit --quiet -m 'Rebuild calendar.ics'

            if git push --quiet; then
              echo "Published the feed on attempt ${attempt}."
              exit 0
            fi

            echo "main moved while the feed was building; rebuilding against it."
            sleep $(( attempt * 3 ))
          done

          echo "::error::Could not publish calendar.ics after 5 attempts."
          exit 1
