name = "troop3-content"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# owner/repo of the site's repository.
GITHUB_REPO = "hwfl850/troop3-website"
GITHUB_BRANCH = "main"
# Only these sites may call the Worker. Comma separated, no trailing slash.
# troop3-website.pages.dev is where Cloudflare Pages serves the site. It
# stays listed after the custom domain cuts over: it is the address that
# still works if DNS ever breaks, and the admin page has to reach the
# Worker from whatever origin it was loaded on.
ALLOWED_ORIGINS = "https://troop3pensacola.org,https://www.troop3pensacola.org,https://troop3-website.pages.dev"

# Secrets are NOT set here. Set them once, from the terminal:
#
#   npx wrangler secret put GITHUB_TOKEN      # fine-grained PAT, Contents: read & write
#   npx wrangler secret put EDIT_PASSWORD     # the leadership password
#   npx wrangler secret put PATROL_PASSWORDS  # optional, JSON: {"pw":"viper"}
#
# Then:  npx wrangler deploy
